plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.manuel.tai'
    compileSdk 34

    defaultConfig {
        applicationId "com.manuel.tai"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        ci {
            def ciStoreFile = project.findProperty('ciStoreFile')
            if (ciStoreFile) {
                storeFile file(ciStoreFile)
                storePassword project.findProperty('ciStorePassword')
                keyAlias project.findProperty('ciKeyAlias')
                keyPassword project.findProperty('ciKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            def ciStoreFile = project.findProperty('ciStoreFile')
            if (ciStoreFile) signingConfig signingConfigs.ci
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    testImplementation 'junit:junit:4.13.2'
}
