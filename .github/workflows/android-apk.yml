name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Remove stale legacy files
        run: |
          rm -f app/build.gradle.kts
          rm -f build.gradle.kts
          rm -f settings.gradle.kts
          rm -f app/src/main/res/values/styles.xml

      - name: Create ephemeral CI test keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/manuel-tai-ci.jks" \
            -storepass manuel-ci-store \
            -keypass manuel-ci-store \
            -alias manuel-tai-ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=ManuelTAi CI, OU=Testing, O=ManuelTAi, L=Remote, S=NA, C=GB"

      - name: Test, lint, and build APKs
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease --stacktrace -PciStoreFile="$RUNNER_TEMP/manuel-tai-ci.jks" -PciStorePassword=manuel-ci-store -PciKeyAlias=manuel-tai-ci -PciKeyPassword=manuel-ci-store

      - name: Verify APK signatures
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ManuelTAi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ManuelTAi-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
